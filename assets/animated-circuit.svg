<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc"><title id="title">Blue profile footer</title><desc id="desc">Soft animated blue footer matching the profile image.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03164d"/><stop offset=".52" stop-color="#0868e6"/><stop offset="1" stop-color="#03246f"/></linearGradient><radialGradient id="glow"><stop stop-color="#9bd8ff" stop-opacity=".4"/><stop offset="1" stop-color="#1680ff" stop-opacity="0"/></radialGradient><style>.wave{fill:none;stroke:#d9f1ff;stroke-opacity:.28;stroke-width:2;animation:float 5s ease-in-out infinite}.wave2{animation-delay:-2s;opacity:.55}.dot{fill:#fff;animation:blink 2s ease-in-out infinite}.dot:nth-of-type(2n){animation-delay:-.7s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}</style></defs><rect width="1200" height="180" rx="22" fill="url(#bg)"/><circle cx="250" cy="190" r="260" fill="url(#glow)"/><circle cx="990" cy="-30" r="260" fill="url(#glow)"/><path class="wave" d="M-20 120C180 30 310 190 500 100s300 20 470-45 220 25 270-5"/><path class="wave wave2" d="M-20 145C170 60 320 220 520 125s290 5 465-38 185 25 235-5"/><circle class="dot" cx="180" cy="72" r="3"/><circle class="dot" cx="940" cy="75" r="3"/><circle class="dot" cx="1040" cy="115" r="3"/><g text-anchor="middle"><text x="600" y="88" fill="#fff" font-family="JetBrains Mono, Courier New, monospace" font-size="20" font-weight="700" letter-spacing="3">SHARE YOUR IMAGINATION</text><text x="600" y="120" fill="#c6e7ff" font-family="JetBrains Mono, Courier New, monospace" font-size="13" letter-spacing="2">LET'S TURN IT INTO REALITY</text></g></svg>
