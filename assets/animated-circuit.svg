<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Abdulrahman Al-Zubaidi — Software and Electronics Engineer</title>
  <desc id="desc">Animated blue circuit board pattern with a software engineer title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050b16"/><stop offset=".55" stop-color="#0a2138"/><stop offset="1" stop-color="#06121f"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#00d9ff" stop-opacity="0"/><stop offset=".5" stop-color="#00d9ff"/><stop offset="1" stop-color="#7df6ff" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#76d9ff" stroke-opacity=".08"/></pattern>
    <style>
      .trace{fill:none;stroke:#00d9ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.48}
      .trace2{fill:none;stroke:#7df6ff;stroke-width:1.3;stroke-dasharray:5 12;animation:dash 8s linear infinite;opacity:.7}
      .node{fill:#00d9ff;filter:url(#soft);animation:pulse 2.4s ease-in-out infinite}
      .node:nth-child(2n){animation-delay:-1.1s}
      .scan{fill:url(#glow);filter:url(#blur);opacity:.35;animation:scan 5s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-120}}
      @keyframes pulse{0%,100%{r:3;opacity:.45}50%{r:6;opacity:1}}
      @keyframes scan{0%,100%{transform:translateX(-520px)}50%{transform:translateX(520px)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      .title{font:700 36px 'JetBrains Mono','Courier New',monospace;letter-spacing:2px;fill:#fff}
      .sub{font:500 16px 'JetBrains Mono','Courier New',monospace;letter-spacing:4px;fill:#8beeff}
      .label{font:600 12px 'JetBrains Mono','Courier New',monospace;fill:#76d9ff;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="url(#grid)" stroke="#00d9ff" stroke-opacity=".28"/>
  <g opacity=".85">
    <path class="trace" d="M0 74H164V128H248V93H344"/><path class="trace2" d="M0 74H164V128H248V93H344"/>
    <path class="trace" d="M1200 66H1042V118H950V87H846"/><path class="trace2" d="M1200 66H1042V118H950V87H846"/>
    <path class="trace" d="M0 274H138V232H230V286H328"/><path class="trace2" d="M0 274H138V232H230V286H328"/>
    <path class="trace" d="M1200 282H1060V230H978V269H864"/><path class="trace2" d="M1200 282H1060V230H978V269H864"/>
    <path class="trace" d="M390 0V48H432V88"/><path class="trace2" d="M390 0V48H432V88"/>
    <path class="trace" d="M810 360V312H768V272"/><path class="trace2" d="M810 360V312H768V272"/>
  </g>
  <g class="node"><circle cx="164" cy="74" r="4"/><circle cx="248" cy="128" r="4"/><circle cx="1042" cy="66" r="4"/><circle cx="950" cy="118" r="4"/><circle cx="138" cy="274" r="4"/><circle cx="230" cy="232" r="4"/><circle cx="1060" cy="282" r="4"/><circle cx="978" cy="230" r="4"/><circle cx="390" cy="48" r="4"/><circle cx="768" cy="312" r="4"/></g>
  <rect class="scan" x="0" y="0" width="110" height="360"/>
  <g text-anchor="middle" style="animation:float 5s ease-in-out infinite">
    <text class="label" x="600" y="92">SOFTWARE • ELECTRONICS • EMBEDDED SYSTEMS</text>
    <text class="title" x="600" y="160">ABDULRAHMAN AL-ZUBAIDI</text>
    <text class="sub" x="600" y="202">TURNING IDEAS INTO REALITY</text>
    <path d="M470 232H730" stroke="#00d9ff" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <text class="label" x="600" y="270">PYTHON  /  AI  /  ARDUINO  /  AUTOMOTIVE</text>
  </g>
</svg>
