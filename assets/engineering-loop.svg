<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Engineering loop</title>
  <desc id="desc">Animated engineering process from idea to reality.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset=".5" stop-color="#0b2239"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#00d9ff"/><stop offset=".5" stop-color="#7df6ff"/><stop offset="1" stop-color="#00d9ff"/></linearGradient>
    <style>
      .box{fill:#0b2239;stroke:#00d9ff;stroke-opacity:.65;stroke-width:1.5;rx:12}
      .txt{font:700 13px 'JetBrains Mono','Courier New',monospace;fill:#fff;letter-spacing:1px}
      .num{font:600 10px 'JetBrains Mono','Courier New',monospace;fill:#7df6ff;letter-spacing:1px}
      .path{fill:none;stroke:url(#line);stroke-width:2.5;stroke-dasharray:7 10;animation:move 5s linear infinite}
      .dot{fill:#fff;filter:drop-shadow(0 0 6px #00d9ff);animation:travel 5s linear infinite}
      @keyframes move{to{stroke-dashoffset:-85}}
      @keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(1050px)}}
    </style>
  </defs>
  <rect width="1200" height="190" rx="18" fill="url(#bg)" stroke="#00d9ff" stroke-opacity=".28"/>
  <path class="path" d="M76 93H1124"/>
  <circle class="dot" cx="76" cy="93" r="5"/>
  <g text-anchor="middle">
    <g transform="translate(80 40)"><rect class="box" width="130" height="106"/><text class="num" x="65" y="28">01</text><text class="txt" x="65" y="63">IDEA</text><text class="num" x="65" y="84">DEFINE</text></g>
    <g transform="translate(270 40)"><rect class="box" width="130" height="106"/><text class="num" x="65" y="28">02</text><text class="txt" x="65" y="63">DESIGN</text><text class="num" x="65" y="84">PLAN</text></g>
    <g transform="translate(460 40)"><rect class="box" width="130" height="106"/><text class="num" x="65" y="28">03</text><text class="txt" x="65" y="63">BUILD</text><text class="num" x="65" y="84">CREATE</text></g>
    <g transform="translate(650 40)"><rect class="box" width="130" height="106"/><text class="num" x="65" y="28">04</text><text class="txt" x="65" y="63">TEST</text><text class="num" x="65" y="84">VALIDATE</text></g>
    <g transform="translate(840 40)"><rect class="box" width="130" height="106"/><text class="num" x="65" y="28">05</text><text class="txt" x="65" y="63">IMPROVE</text><text class="num" x="65" y="84">ITERATE</text></g>
    <g transform="translate(1030 40)"><rect class="box" width="130" height="106"/><text class="num" x="65" y="28">06</text><text class="txt" x="65" y="63">REALITY</text><text class="num" x="65" y="84">SHIP</text></g>
  </g>
</svg>
