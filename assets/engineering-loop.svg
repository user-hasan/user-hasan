<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc"><title id="title">Engineering loop</title><desc id="desc">A clean animated blue engineering process.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03164d"/><stop offset=".55" stop-color="#0868e6"/><stop offset="1" stop-color="#03246f"/></linearGradient><linearGradient id="line"><stop stop-color="#7ecbff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#7ecbff"/></linearGradient><style>.box{fill:#fff;fill-opacity:.1;stroke:#c3eaff;stroke-opacity:.38;stroke-width:1.5}.txt{font:700 13px 'JetBrains Mono','Courier New',monospace;fill:#fff;letter-spacing:1px}.num{font:600 10px 'JetBrains Mono','Courier New',monospace;fill:#bce6ff;letter-spacing:1px}.path{fill:none;stroke:url(#line);stroke-width:2.5;stroke-dasharray:7 10;animation:move 5s linear infinite}.dot{fill:#fff;filter:drop-shadow(0 0 6px #b8e5ff);animation:travel 5s linear infinite}@keyframes move{to{stroke-dashoffset:-85}}@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(1050px)}}</style></defs><rect width="1200" height="190" rx="22" fill="url(#bg)"/><circle cx="1000" cy="20" r="260" fill="#8dcbff" opacity=".12"/><path class="path" d="M76 93H1124"/><circle class="dot" cx="76" cy="93" r="5"/><g text-anchor="middle"><g transform="translate(80 40)"><rect class="box" width="130" height="106" rx="14"/><text class="num" x="65" y="28">01</text><text class="txt" x="65" y="63">IDEA</text><text class="num" x="65" y="84">DEFINE</text></g><g transform="translate(270 40)"><rect class="box" width="130" height="106" rx="14"/><text class="num" x="65" y="28">02</text><text class="txt" x="65" y="63">DESIGN</text><text class="num" x="65" y="84">PLAN</text></g><g transform="translate(460 40)"><rect class="box" width="130" height="106" rx="14"/><text class="num" x="65" y="28">03</text><text class="txt" x="65" y="63">BUILD</text><text class="num" x="65" y="84">CREATE</text></g><g transform="translate(650 40)"><rect class="box" width="130" height="106" rx="14"/><text class="num" x="65" y="28">04</text><text class="txt" x="65" y="63">TEST</text><text class="num" x="65" y="84">VALIDATE</text></g><g transform="translate(840 40)"><rect class="box" width="130" height="106" rx="14"/><text class="num" x="65" y="28">05</text><text class="txt" x="65" y="63">IMPROVE</text><text class="num" x="65" y="84">ITERATE</text></g><g transform="translate(1030 40)"><rect class="box" width="130" height="106" rx="14"/><text class="num" x="65" y="28">06</text><text class="txt" x="65" y="63">REALITY</text><text class="num" x="65" y="84">SHIP</text></g></g></svg>
