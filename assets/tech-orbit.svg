<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Technology orbit</title>
  <desc id="desc">Animated technology orbit showing Python, AI, embedded systems and automotive electronics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset=".5" stop-color="#102d42"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <style>
      .pill{fill:#0b2239;stroke:#00d9ff;stroke-opacity:.65;stroke-width:1.4}
      .t{font:600 13px 'JetBrains Mono','Courier New',monospace;fill:#dffbff;letter-spacing:1px}
      .orbit{fill:none;stroke:#00d9ff;stroke-opacity:.22;stroke-dasharray:4 11;animation:spin 18s linear infinite;transform-origin:600px 75px}
      .spark{fill:#7df6ff;animation:pulse 2s ease-in-out infinite}
      .spark:nth-of-type(2n){animation-delay:-.8s}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="150" rx="18" fill="url(#bg)" stroke="#00d9ff" stroke-opacity=".28"/>
  <ellipse class="orbit" cx="600" cy="75" rx="530" ry="46"/><ellipse class="orbit" cx="600" cy="75" rx="360" ry="34"/>
  <circle class="spark" cx="105" cy="75" r="3"/><circle class="spark" cx="260" cy="42" r="3"/><circle class="spark" cx="940" cy="112" r="3"/><circle class="spark" cx="1080" cy="75" r="3"/>
  <g text-anchor="middle">
    <g transform="translate(48 48)"><rect class="pill" width="190" height="54" rx="27"/><text class="t" x="95" y="33">PYTHON / AI</text></g>
    <g transform="translate(285 48)"><rect class="pill" width="190" height="54" rx="27"/><text class="t" x="95" y="33">ARDUINO / IoT</text></g>
    <g transform="translate(525 48)"><rect class="pill" width="150" height="54" rx="27" fill="#00d9ff" fill-opacity=".14"/><text class="t" x="75" y="33">BUILD</text></g>
    <g transform="translate(725 48)"><rect class="pill" width="190" height="54" rx="27"/><text class="t" x="95" y="33">CAN BUS</text></g>
    <g transform="translate(962 48)"><rect class="pill" width="190" height="54" rx="27"/><text class="t" x="95" y="33">AUTOMOTIVE</text></g>
  </g>
</svg>
