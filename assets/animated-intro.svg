<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">Abdulrahman Al-Zubaidi introduction</title><desc id="desc">Clean animated royal-blue introduction banner.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03164d"/><stop offset=".48" stop-color="#075bd4"/><stop offset="1" stop-color="#03246f"/></linearGradient><radialGradient id="light"><stop stop-color="#68baff" stop-opacity=".55"/><stop offset="1" stop-color="#1680ff" stop-opacity="0"/></radialGradient><linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><style>.headline{font:700 34px 'JetBrains Mono','Courier New',monospace;letter-spacing:2px;fill:#fff}.sub{font:600 15px 'JetBrains Mono','Courier New',monospace;letter-spacing:3px;fill:#c6e7ff}.small{font:500 12px 'JetBrains Mono','Courier New',monospace;letter-spacing:2px;fill:#a9d7ff}.orb{fill:none;stroke:#8dcbff;stroke-opacity:.18;stroke-width:2}.shine{fill:url(#shine);animation:slide 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes slide{0%,100%{transform:translateX(-520px)}50%{transform:translateX(520px)}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}</style></defs><rect width="1200" height="210" rx="22" fill="url(#bg)"/><circle cx="170" cy="30" r="210" fill="url(#light)"/><circle cx="1060" cy="210" r="280" fill="url(#light)" opacity=".5"/><ellipse class="orb" cx="600" cy="108" rx="470" ry="76"/><ellipse class="orb" cx="600" cy="108" rx="540" ry="94"/><path d="M110 166C350 82 830 235 1090 84" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/><rect class="shine" x="0" y="0" width="250" height="210" opacity=".16"/><g text-anchor="middle" class="pulse"><text class="small" x="600" y="43">SOFTWARE  /  ELECTRONICS  /  EMBEDDED SYSTEMS</text><text class="headline" x="600" y="103">ABDULRAHMAN AL-ZUBAIDI</text><text class="sub" x="600" y="140">BUILDING SMART SYSTEMS FROM CODE TO CIRCUIT</text><path d="M420 164H780" stroke="#b8e5ff" stroke-width="2" stroke-linecap="round" opacity=".8"/><text class="small" x="600" y="190">PYTHON  •  AI  •  ARDUINO  •  AUTOMOTIVE  •  MECHATRONICS</text></g></svg>
